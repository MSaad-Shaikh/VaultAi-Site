<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css" />

<body class="bg-grid-pattern min-h-screen flex flex-col">
  <nav class="navbar scrolled">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
        <span>Vault<span class="text-indigo-400">AI</span></span>

        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </a>

  </main>

  <footer class="py-6 border-t border-slate-800/80 text-center text-xs text-slate-500">

  </footer>
  <script>if (window.lucide) lucide.createIcons();</script>
